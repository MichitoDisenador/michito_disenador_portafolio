
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paola Herrera | Diseño Gráfico</title>

<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap" rel="stylesheet">

<style>
/* ===== TOKENS ===== */
:root {
    --bg:          #FFD93D;
    --bg-alt:      #FFCF00;
    --text:        #1E1E1E;
    --accent:      #1E1E1E;
    --muted:       #4a4a4a;
    --card:        rgba(0,0,0,.06);
    --social:      #1E1E1E;
    --copy-gray:   #666;
    --name-color:  #1E1E1E;
    --logo-filter: brightness(0) invert(0);
    --cursor-bg:   #1E1E1E;
}

body.dark-mode {
    --bg:          #0a0a0a;
    --bg-alt:      #111;
    --text:        #FFD93D;
    --accent:      #FFD93D;
    --muted:       #aaa;
    --card:        rgba(255,217,61,.07);
    --social:      #fff;
    --copy-gray:   #666;
    --name-color:  #FFD93D;
    --logo-filter: none;
    --cursor-bg:   #FFD93D;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    transition: background .4s ease, color .4s ease;
    cursor: none;
}

/* ===== CURSOR CUSTOM ===== */
#cursor {
    position: fixed;
    width: 12px;
    height: 12px;
    background: var(--cursor-bg);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    transition: transform .1s ease, background .3s ease;
    mix-blend-mode: multiply;
}

body.dark-mode #cursor { mix-blend-mode: normal; }

#cursor.grow {
    transform: translate(-50%, -50%) scale(4);
    opacity: .35;
}

/* ===== CANVAS PARTÍCULAS ===== */
#particleCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: .4;
}

/* ===== LOADER ===== */
.loader-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 1.5rem;
    transition: opacity .6s ease, visibility .6s ease;
}
.loader-screen.hidden { opacity:0; visibility:hidden; }

.loader-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 4rem);
    letter-spacing: -1px;
    overflow: hidden;
}

.loader-name span {
    display: inline-block;
    opacity: 0;
    transform: translateY(100%);
    animation: charReveal .05s ease forwards;
}

@keyframes charReveal {
    to { opacity:1; transform:translateY(0); }
}

.loader-bar-wrap {
    width: 180px;
    height: 2px;
    background: rgba(0,0,0,.15);
    border-radius: 2px;
    overflow: hidden;
}
body.dark-mode .loader-bar-wrap { background: rgba(255,217,61,.2); }

.loader-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
    animation: loadBar 1s ease forwards;
}

@keyframes loadBar {
    to { width: 100%; }
}

/* ===== PAGE ===== */
.page {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity .5s ease;
}
.page.loaded { opacity: 1; }

/* ===== HEADER ===== */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.8rem 3rem;
    position: relative;
    z-index: 10;
}

.logo img {
    height: 62px;
    filter: var(--logo-filter);
    transition: transform .3s ease, filter .3s ease;
}
.logo img:hover { transform: scale(.92); }

.header-right {
    display: flex;
    align-items: center;
    gap: 1.2rem;
}

/* Badge "DISPONIBLE" */
.available-badge {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    padding: .35rem .8rem;
    border-radius: 100px;
    opacity: 0;
    transform: translateX(20px);
    transition: border-color .3s, color .3s;
}
.page.loaded .available-badge {
    animation: slideInRight .5s .3s ease forwards;
}
.available-badge .dot {
    width: 6px; height: 6px;
    background: #22c55e;
    border-radius: 50%;
    animation: blink 1.5s infinite;
}
@keyframes blink {
    0%,100% { opacity:1; }
    50% { opacity:.2; }
}

.theme-toggle {
    background: none;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-size: 1.1rem;
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: none;
    display: flex; align-items: center; justify-content: center;
    transition: all .3s ease;
    opacity: 0;
    transform: translateX(20px);
}
.page.loaded .theme-toggle {
    animation: slideInRight .5s .15s ease forwards;
}
.theme-toggle:hover {
    background: var(--accent);
    color: var(--bg);
    transform: rotate(20deg) scale(1.1);
}

/* ===== MAIN ===== */
main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 2rem;
    position: relative;
}

/* Michito */
.michito-wrap {
    position: relative;
    margin-bottom: 1.8rem;
    opacity: 0;
    transform: translateY(30px) scale(.96);
}
.page.loaded .michito-wrap {
    animation: floatIn .7s .6s cubic-bezier(.22,1,.36,1) forwards;
}

.michito {
    width: min(340px, 58vw);
    max-height: 38vh;
    object-fit: contain;
    display: block;
    transition: transform .4s ease;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,.12));
}

body.dark-mode .michito {
    filter: drop-shadow(0 20px 40px rgba(255,217,61,.15));
}

.michito-wrap:hover .michito { transform: translateY(-6px) scale(1.02); }

/* ===== HERO TEXT ===== */
.hero-text {
    margin-bottom: 2rem;
    opacity: 0;
    transform: translateY(20px);
}
.page.loaded .hero-text {
    animation: fadeUp .6s .85s ease forwards;
}

.hero-role {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: clamp(.75rem, 1.5vw, .95rem);
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .4rem;
}

.hero-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    line-height: .95;
    letter-spacing: -2px;
    color: var(--text);
    position: relative;
    display: inline-block;
}

/* Subrayado animado bajo el nombre */
.hero-title::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0;
    width: 0%; height: 4px;
    background: var(--accent);
    border-radius: 2px;
    transition: none;
}
.page.loaded .hero-title::after {
    animation: lineGrow .6s 1.4s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes lineGrow {
    to { width: 100%; }
}

/* Texto rotativo */
.rotating-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    margin-top: .5rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(.85rem, 1.8vw, 1.1rem);
    font-weight: 400;
    color: var(--muted);
}

.rotating-text {
    color: var(--accent);
    font-weight: 600;
    min-width: 180px;
    text-align: left;
    position: relative;
}

.rotating-text::after {
    content: '|';
    animation: cursorBlink .7s infinite;
    margin-left: 2px;
}
@keyframes cursorBlink {
    0%,100% { opacity:1; }
    50% { opacity:0; }
}

/* ===== NAV ===== */
.main-nav {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
}
.page.loaded .main-nav {
    animation: fadeUp .6s 1.05s ease forwards;
}

.nav-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    text-decoration: none;
    color: var(--bg);
    background: var(--accent);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    padding: .8rem 1.8rem;
    border-radius: 100px;
    cursor: none;
    overflow: hidden;
    transition: gap .3s ease;
    /* Efecto magnético via JS */
}

/* Capa de hover */
.nav-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.12);
    opacity: 0;
    transition: opacity .3s;
    border-radius: inherit;
}
.nav-btn:hover::before { opacity: 1; }
.nav-btn:hover { gap: .9rem; }

.nav-btn i { font-size: .85rem; transition: transform .3s ease; }
.nav-btn:hover i { transform: translateX(4px); }

/* Ripple */
.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.25);
    width: 80px; height: 80px;
    margin-top: -40px; margin-left: -40px;
    animation: rippleAnim .5s linear;
    pointer-events: none;
}
@keyframes rippleAnim {
    0%   { transform:scale(0); opacity:.6; }
    100% { transform:scale(5); opacity:0; }
}

/* ===== FOOTER ===== */
footer {
    padding: 1.2rem;
    text-align: center;
    position: relative;
    z-index: 10;
}

.social {
    display: flex;
    justify-content: center;
    gap: 1.2rem;
    margin-bottom: .6rem;
    opacity: 0;
}
.page.loaded .social {
    animation: fadeUp .5s 1.25s ease forwards;
}

.social a {
    color: var(--social);
    font-size: 1.2rem;
    cursor: none;
    transition: transform .25s ease, color .25s;
    display: inline-block;
}
.social a:hover { transform: translateY(-5px) scale(1.2); }

.copy {
    font-size: .8rem;
    color: var(--copy-gray);
    opacity: 0;
}
.page.loaded .copy {
    animation: fadeUp .5s 1.4s ease forwards;
}
.copy .name-color {
    color: var(--name-color);
    font-weight: 600;
    transition: color .3s;
}

/* ===== KEYFRAMES GLOBALES ===== */
@keyframes floatIn {
    to { opacity:1; transform:translateY(0) scale(1); }
}
@keyframes fadeUp {
    to { opacity:1; transform:translateY(0); }
}
@keyframes slideInRight {
    to { opacity:1; transform:translateX(0); }
}

/* ===== MOBILE ===== */
@media (max-width:768px) {
    header { padding: 1rem 1.2rem; }
    .logo img { height: 48px; }
    .available-badge { display: none; }
    .michito { width: min(260px, 75vw); }
    .main-nav { flex-direction: column; width:100%; max-width:260px; }
    .nav-btn { justify-content: center; width:100%; }
    body { cursor: auto; }
    #cursor { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
<body>

<!-- CURSOR -->
<div id="cursor"></div>

<!-- PARTÍCULAS -->
<canvas id="particleCanvas"></canvas>

<!-- LOADER -->
<div class="loader-screen" id="loaderScreen">
    <div class="loader-name" id="loaderName"></div>
    <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
</div>

<!-- PAGE -->
<div class="page" id="mainPage">

<header>
    <div class="logo">
        <img src="assets/about/MICHITO_MEMBRETADA-04.webp" alt="Michito Diseñador">
    </div>
    <div class="header-right">
        <div class="available-badge">
            <span class="dot"></span>
            Disponible
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
            <i class="fas fa-moon"></i>
        </button>
    </div>
</header>

<main>
    <div class="michito-wrap">
        <img class="michito" src="assets/michito-index.png" alt="Michito Diseñador">
    </div>

    <div class="hero-text">
        <p class="hero-role">Diseñadora Gráfica &amp; Creativa</p>
        <h1 class="hero-title">Paola Herrera</h1>
        <div class="rotating-wrap">
            Especialista en&nbsp;<span class="rotating-text" id="rotatingText"></span>
        </div>
    </div>

    <nav class="main-nav">
        <a href="about.html" class="nav-btn" data-magnetic>
            <i class="fas fa-circle-chevron-right"></i>
            Sobre mí
        </a>
        <a href="portfolio.html" class="nav-btn" data-magnetic>
            <i class="fas fa-circle-chevron-right"></i>
            Portafolio
        </a>
        <a href="contact.html" class="nav-btn" data-magnetic>
            <i class="fas fa-circle-chevron-right"></i>
            Contacto
        </a>
    </nav>
</main>

<footer>
    <div class="social">
        <a href="https://github.com/MichitoDisenador"           target="_blank" aria-label="GitHub">   <i class="fab fa-github"></i>     </a>
        <a href="https://dribbble.com/michitodisenador"          target="_blank" aria-label="Dribbble"> <i class="fab fa-dribbble"></i>   </a>
        <a href="https://www.linkedin.com/in/michito-disenador/" target="_blank" aria-label="LinkedIn"> <i class="fab fa-linkedin"></i>   </a>
        <a href="https://www.facebook.com/michitodisenador"      target="_blank" aria-label="Facebook"> <i class="fab fa-facebook-f"></i> </a>
        <a href="mailto:sapichaan@gmail.com"                                      aria-label="Email">   <i class="fas fa-envelope"></i>   </a>
    </div>
    <div class="copy">
        © 2026 | Diseñado con ❤️ por <span class="name-color">Paola Herrera Sol</span>
    </div>
</footer>

</div><!-- /page -->

<script>
/* ============================================================
   LOADER - animación letra a letra
   ============================================================ */
(function(){
    const name   = "Paola Herrera";
    const el     = document.getElementById('loaderName');
    let   delay  = 0;

    [...name].forEach(ch => {
        const span = document.createElement('span');
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        span.style.animationDelay = delay + 's';
        el.appendChild(span);
        delay += 0.05;
    });
})();

/* ============================================================
   TEMA
   ============================================================ */
const body = document.body;
const btn  = document.getElementById('themeToggle');
const icon = btn.querySelector('i');

if (localStorage.getItem('theme') === 'dark') {
    body.classList.add('dark-mode');
    icon.classList.replace('fa-moon','fa-sun');
}

btn.addEventListener('click', () => {
    body.classList.toggle('dark-mode');
    const dark = body.classList.contains('dark-mode');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    icon.classList.replace(dark ? 'fa-moon' : 'fa-sun', dark ? 'fa-sun' : 'fa-moon');
});

/* ============================================================
   REVEAL PRINCIPAL
   ============================================================ */
window.addEventListener('load', () => {
    setTimeout(() => {
        const loader   = document.getElementById('loaderScreen');
        const mainPage = document.getElementById('mainPage');

        // Primero ocultar el loader
        loader.classList.add('hidden');

        // Luego, en el siguiente frame de pintura, mostrar la página
        // (sin el rAF el browser colapsa ambos cambios en un solo repintado
        // y la transición de opacity no tiene punto de partida visible)
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                mainPage.classList.add('loaded');
            });
        });
    }, 1200);
});

/* ============================================================
   PARTÍCULAS
   ============================================================ */
(function(){
    const canvas = document.getElementById('particleCanvas');
    const ctx    = canvas.getContext('2d');
    let W, H, particles = [];

    function resize(){
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function color(){
        return body.classList.contains('dark-mode')
            ? `rgba(255,217,61,`
            : `rgba(0,0,0,`;
    }

    class Particle {
        constructor(){
            this.x  = Math.random() * (W||800);
            this.y  = Math.random() * (H||600);
            this.r  = Math.random() * 2.5 + .5;
            this.vx = (Math.random() - .5) * .4;
            this.vy = (Math.random() - .5) * .4;
            this.a  = Math.random() * .18 + .04;
        }
        update(){
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > W) this.vx *= -1;
            if (this.y < 0 || this.y > H) this.vy *= -1;
        }
        draw(){
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
            ctx.fillStyle = color() + this.a + ')';
            ctx.fill();
        }
    }

    for (let i = 0; i < 55; i++) particles.push(new Particle());

    // Líneas entre partículas cercanas
    function connectParticles(){
        for (let i=0; i<particles.length; i++){
            for (let j=i+1; j<particles.length; j++){
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 110){
                    ctx.strokeStyle = color() + (1 - dist/110) * .07 + ')';
                    ctx.lineWidth = .8;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.stroke();
                }
            }
        }
    }

    function loop(){
        ctx.clearRect(0,0,W,H);
        particles.forEach(p => { p.update(); p.draw(); });
        connectParticles();
        requestAnimationFrame(loop);
    }
    loop();
})();

/* ============================================================
   CURSOR CUSTOM
   ============================================================ */
(function(){
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top  = e.clientY + 'px';
    });
    const hoverable = 'a, button, .nav-btn, .theme-toggle, .logo img';
    document.querySelectorAll(hoverable).forEach(el => {
        el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
        el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
    });
})();

/* ============================================================
   TEXTO ROTATIVO
   ============================================================ */
(function(){
    const phrases = [
        'Identidad Visual',
        'Diseño Editorial',
        'Branding Creativo',
        'Motion & UI',
        'Packaging',
    ];
    const el = document.getElementById('rotatingText');
    if (!el) return;

    let phraseIdx = 0, charIdx = 0, deleting = false;
    const speed = { type: 70, delete: 40, pause: 1600 };

    function type(){
        const current = phrases[phraseIdx];

        if (!deleting) {
            el.textContent = current.slice(0, ++charIdx);
            if (charIdx === current.length) {
                deleting = true;
                setTimeout(type, speed.pause);
                return;
            }
        } else {
            el.textContent = current.slice(0, --charIdx);
            if (charIdx === 0) {
                deleting = false;
                phraseIdx = (phraseIdx + 1) % phrases.length;
            }
        }
        setTimeout(type, deleting ? speed.delete : speed.type);
    }

    setTimeout(type, 1800);
})();

/* ============================================================
   RIPPLE EN BOTONES
   ============================================================ */
document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', function(e){
        const r = document.createElement('span');
        r.classList.add('ripple');
        this.appendChild(r);
        const rect = this.getBoundingClientRect();
        r.style.left = (e.clientX - rect.left) + 'px';
        r.style.top  = (e.clientY - rect.top)  + 'px';
        setTimeout(() => r.remove(), 500);
    });
});

/* ============================================================
   EFECTO MAGNÉTICO EN BOTONES
   ============================================================ */
document.querySelectorAll('[data-magnetic]').forEach(el => {
    el.addEventListener('mousemove', function(e){
        const rect = this.getBoundingClientRect();
        const cx = rect.left + rect.width  / 2;
        const cy = rect.top  + rect.height / 2;
        const dx = (e.clientX - cx) * .28;
        const dy = (e.clientY - cy) * .28;
        this.style.transform = `translate(${dx}px, ${dy}px)`;
    });
    el.addEventListener('mouseleave', function(){
        this.style.transform = '';
    });
});
</script>
</body>
