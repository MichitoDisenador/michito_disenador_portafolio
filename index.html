<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paola Herrera | Diseño Gráfico</title>

<!-- Favicon completo -->
<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#FFD93D;
    --text:#1E1E1E;
    --accent:#1E1E1E;
    --card:rgba(255,255,255,.12);
    --social:#1E1E1E;
    --copy-gray:#666666;
    --name-color:#1E1E1E;      /* Nombre en negro para modo claro */
    --logo-filter: brightness(0) invert(0);  /* Logo negro en modo claro (fondo amarillo) */
}

body.dark-mode{
    --bg:#000000;
    --text:#FFD93D;
    --accent:#FFD93D;
    --card:rgba(255,215,0,.08);
    --social:#FFFFFF;
    --copy-gray:#888888;
    --name-color:#FFD93D;       /* Nombre en amarillo para modo oscuro */
    --logo-filter: none;        /* Logo con su color original en modo oscuro */
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', Arial, Helvetica, sans-serif;
    transition:.3s ease;
}

/* ========== PANTALLA DE CARGA ========== */
.loader-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 2rem;
    transition: opacity 0.6s ease, visibility 0.6s ease;
}

.loader-screen.hidden {
    opacity: 0;
    visibility: hidden;
}

/* Spinner de carga */
.spinner {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(0,0,0,0.1);
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loader-text {
    font-size: 1.2rem;
    font-weight: 500;
    letter-spacing: 2px;
    animation: pulse 1.5s ease infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

/* ========== CONTENIDO PRINCIPAL CON FADE-IN ========== */
.page {
    height: 100vh;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

.page.loaded {
    opacity: 1;
    transform: translateY(0);
}

/* Animaciones escalonadas para elementos hijos */
.fade-item {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s ease;
}

.page.loaded .fade-item {
    opacity: 1;
    transform: translateY(0);
}

/* Retrasos escalonados para cada elemento */
.page.loaded .logo { transition-delay: 0.1s; }
.page.loaded .theme-toggle { transition-delay: 0.15s; }
.page.loaded .michito { transition-delay: 0.2s; }
.page.loaded .nav-btn:nth-child(1) { transition-delay: 0.35s; }
.page.loaded .nav-btn:nth-child(2) { transition-delay: 0.5s; }
.page.loaded .nav-btn:nth-child(3) { transition-delay: 0.65s; }
.page.loaded .social a:nth-child(1) { transition-delay: 0.8s; }
.page.loaded .social a:nth-child(2) { transition-delay: 0.9s; }
.page.loaded .social a:nth-child(3) { transition-delay: 1.0s; }
.page.loaded .social a:nth-child(4) { transition-delay: 1.1s; }
.page.loaded .social a:nth-child(5) { transition-delay: 1.2s; }
.page.loaded .copy { transition-delay: 1.3s; }

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:2rem 3rem;
}

.logo img{
    height:75px;
    filter: var(--logo-filter);
    transition: transform 0.3s ease, filter 0.3s ease;
}

/* Animación del logo al pasar el mouse: se hace más pequeño */
.logo img:hover {
    transform: scale(0.9);
}

.theme-toggle{
    background:none;
    border:none;
    color:var(--accent);
    font-size:2rem;
    cursor:pointer;
    transition: transform 0.3s ease;
}

.theme-toggle:hover {
    transform: rotate(15deg);
}

/* MAIN */
main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:2rem;
}

.michito{
    width:min(420px,70vw);
    max-height:45vh;
    object-fit:contain;
    margin-bottom:2rem;
    transition: transform 0.3s ease;
}

.michito:hover {
    transform: scale(1.02);
}

/* NAV - Botones SIN líneas, solo animación del círculo/ripple */
.main-nav{
    display:flex;
    gap:2rem;
    flex-wrap:wrap;
    justify-content:center;
}

.nav-btn{
    display:flex;
    align-items:center;
    gap:.8rem;
    text-decoration:none;
    color:var(--accent);
    font-size:1.6rem;
    font-weight:600;
    padding:1rem 1.8rem;
    border: none;
    background: transparent;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    position: relative;
    overflow: hidden;
}

/* ELIMINADA la línea amarilla que salía debajo (ya no hay ::before) */

.nav-btn:hover {
    transform: translateY(-4px) scale(1.05);
    gap: 1.2rem;
}

.nav-btn i {
    transition: transform 0.3s ease;
}

.nav-btn:hover i {
    transform: translateX(5px);
}

/* Animación de clic para los botones (efecto círculo/ripple) */
.nav-btn:active {
    transform: translateY(2px) scale(0.98);
}

/* Animación específica para cada botón - bounce en el icono */
.nav-btn:nth-child(1):hover i {
    animation: bounce 0.5s ease;
}

.nav-btn:nth-child(2):hover i {
    animation: bounce 0.5s ease 0.1s;
}

.nav-btn:nth-child(3):hover i {
    animation: bounce 0.5s ease 0.2s;
}

@keyframes bounce {
    0%, 100% {
        transform: translateX(0);
    }
    50% {
        transform: translateX(8px);
    }
}

/* Animación de entrada para los botones */
@keyframes slideInLeft {
    from {
        opacity: 0;
        transform: translateX(-50px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes slideInRight {
    from {
        opacity: 0;
        transform: translateX(50px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes slideInUp {
    from {
        opacity: 0;
        transform: translateY(50px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Animaciones diferentes para cada botón al cargar */
.page.loaded .nav-btn:nth-child(1) {
    animation: slideInLeft 0.6s ease forwards;
}

.page.loaded .nav-btn:nth-child(2) {
    animation: slideInUp 0.6s ease forwards;
}

.page.loaded .nav-btn:nth-child(3) {
    animation: slideInRight 0.6s ease forwards;
}

/* FOOTER */
footer{
    padding:1.5rem;
    text-align:center;
}

.social{
    display:flex;
    justify-content:center;
    gap:1.5rem;
    margin-bottom:.8rem;
}

.social a{
    color:var(--social);
    font-size:1.5rem;
    transition: all 0.3s ease;
    display: inline-block;
}

.social a:hover {
    transform: translateY(-5px) scale(1.2);
    animation: socialPop 0.3s ease;
}

@keyframes socialPop {
    0% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.3);
    }
    100% {
        transform: scale(1);
    }
}

/* Texto del copyright en GRIS */
.copy{
    font-size:.9rem;
    opacity:1;
    color: var(--copy-gray);
    transition: color 0.3s ease;
}

/* "Paola Herrera Sol" cambia de color según el tema */
.copy .name-color {
    color: var(--name-color);
    font-weight: 600;
    transition: color 0.3s ease;
}

/* MOBILE */
@media(max-width:768px){
    header{
        padding:1rem 1.5rem;
    }
    .logo img{
        height:55px;
    }
    .michito{
        width:min(300px,80vw);
    }
    .main-nav{
        flex-direction:column;
        width:100%;
        max-width:320px;
    }
    .nav-btn{
        justify-content:center;
        width:100%;
    }
    
    /* Ajuste de animaciones para móvil */
    @keyframes slideInLeft {
        from {
            opacity: 0;
            transform: translateX(-30px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
    
    @keyframes slideInRight {
        from {
            opacity: 0;
            transform: translateX(30px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
}

</style>
</head>

<body>

<!-- PANTALLA DE CARGA -->
<div class="loader-screen" id="loaderScreen">
    <div class="spinner"></div>
    <div class="loader-text">Cargando...</div>
</div>

<div class="page" id="mainPage">

<header>

    <div class="logo fade-item">
        <!-- ⭐⭐⭐ MODIFICA LA RUTA DE LA IMAGEN DEL LOGO AQUÍ ⭐⭐⭐ -->
        <img src="assets/about/MICHITO_MEMBRETADA-04.webp" alt="Michito Diseñador">
    </div>

    <button class="theme-toggle fade-item" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

</header>

<main>

    <!-- ⭐⭐⭐ MODIFICA LA RUTA DE LA IMAGEN "MICHITO DISEÑADOR" AQUÍ ⭐⭐⭐ -->
    <img
        class="michito fade-item"
        src="assets/michito-home.webp"
        alt="Michito Diseñador">

    <nav class="main-nav">

        <a href="about.html" class="nav-btn fade-item">
            <i class="fas fa-circle-chevron-right"></i>
            Sobre mí
        </a>

        <a href="portfolio.html" class="nav-btn fade-item">
            <i class="fas fa-circle-chevron-right"></i>
            Portafolio
        </a>

        <a href="contact.html" class="nav-btn fade-item">
            <i class="fas fa-circle-chevron-right"></i>
            Contacto
        </a>

    </nav>

</main>

<footer>

    <div class="social">

        <a href="https://github.com/MichitoDisenador" target="_blank" class="fade-item">
            <i class="fab fa-github"></i>
        </a>

        <a href="https://dribbble.com/michitodisenador" target="_blank" class="fade-item">
            <i class="fab fa-dribbble"></i>
        </a>

        <a href="https://www.linkedin.com/in/michito-disenador/" target="_blank" class="fade-item">
            <i class="fab fa-linkedin"></i>
        </a>

        <a href="https://www.facebook.com/michitodisenador" target="_blank" class="fade-item">
            <i class="fab fa-facebook-f"></i>
        </a>

        <a href="mailto:sapichaan@gmail.com" class="fade-item">
            <i class="fas fa-envelope"></i>
        </a>

    </div>

    <div class="copy fade-item">
        © 2026 | Diseñado con ❤️ por <span class="name-color">Paola Herrera Sol</span>
    </div>

</footer>

</div>

<script>

// ========== PANTALLA DE CARGA ==========
window.addEventListener('load', function() {
    const loader = document.getElementById('loaderScreen');
    const mainPage = document.getElementById('mainPage');
    
    setTimeout(function() {
        loader.classList.add('hidden');
        mainPage.classList.add('loaded');
    }, 800);
});

// ========== TEMA OSCURO/CLARO ==========
const body = document.body;
const btn = document.getElementById("themeToggle");
const icon = btn.querySelector("i");

const savedTheme = localStorage.getItem("theme");

if(savedTheme === "dark"){
    body.classList.add("dark-mode");
    icon.classList.replace("fa-moon","fa-sun");
}

btn.addEventListener("click",()=>{
    body.classList.toggle("dark-mode");

    if(body.classList.contains("dark-mode")){
        localStorage.setItem("theme","dark");
        icon.classList.replace("fa-moon","fa-sun");
    }else{
        localStorage.setItem("theme","light");
        icon.classList.replace("fa-sun","fa-moon");
    }
});

// ========== PRE-CARGA DE IMÁGENES ==========
function preloadImages() {
    const images = document.querySelectorAll('img');
    let loadedImages = 0;
    const totalImages = images.length;
    
    if(totalImages === 0) return;
    
    images.forEach(img => {
        if(img.complete) {
            loadedImages++;
        } else {
            img.addEventListener('load', () => {
                loadedImages++;
            });
            img.addEventListener('error', () => {
                loadedImages++;
            });
        }
    });
}

preloadImages();

// ========== ANIMACIÓN DEL CÍRCULO (RIPPLE) AL HACER CLIC ==========
const navButtons = document.querySelectorAll('.nav-btn');
navButtons.forEach(button => {
    button.addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        this.appendChild(ripple);
        
        const x = e.clientX - e.target.offsetLeft;
        const y = e.clientY - e.target.offsetTop;
        
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        
        setTimeout(() => {
            ripple.remove();
        }, 600);
    });
});

const styleRipple = document.createElement('style');
styleRipple.textContent = `
    .nav-btn {
        position: relative;
        overflow: hidden;
    }
    
    .ripple {
        position: absolute;
        border-radius: 50%;
        background-color: rgba(0, 0, 0, 0.3);
        width: 100px;
        height: 100px;
        margin-top: -50px;
        margin-left: -50px;
        animation: ripple 0.6s linear;
        pointer-events: none;
    }
    
    @keyframes ripple {
        0% {
            transform: scale(0);
            opacity: 0.6;
        }
        100% {
            transform: scale(4);
            opacity: 0;
        }
    }
    
    body.dark-mode .ripple {
        background-color: rgba(255, 217, 61, 0.3);
    }
`;
document.head.appendChild(styleRipple);

</script>

</body>
</html>
