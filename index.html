<script>
        const translations = {
            es: {
                current: "ES",
                role: "Diseñadora gráfica y creativa",
                specialist: "Especialista en",
                words: ["branding", "ilustración", "social media", "diseño editorial"],
                navAbout: "> Sobre mí",
                navPortfolio: "> Portafolio",
                navContact: "> Contacto",
                copy: "© 2026 | Diseñado por Paola Herrera Sol"
            },
            en: {
                current: "EN",
                role: "Graphic designer and creative",
                specialist: "Specialist in",
                words: ["branding", "illustration", "social media", "editorial design"],
                navAbout: "> About me",
                navPortfolio: "> Portfolio",
                navContact: "> Contact",
                copy: "© 2026 | Designed by Paola Herrera Sol"
            },
            fr: {
                current: "FR",
                role: "Graphiste et créative",
                specialist: "Spécialiste en",
                words: ["branding", "illustration", "réseaux sociaux", "design éditorial"],
                navAbout: "> À propos",
                navPortfolio: "> Portfolio",
                navContact: "> Contact",
                copy: "© 2026 | Conçu par Paola Herrera Sol"
            },
            pt: {
                current: "PT",
                role: "Designer gráfica e criativa",
                specialist: "Especialista em",
                words: ["branding", "ilustração", "mídias sociais", "design editorial"],
                navAbout: "> Sobre mim",
                navPortfolio: "> Portfólio",
                navContact: "> Contato",
                copy: "© 2026 | Projetado por Paola Herrera Sol"
            }
        };

        // --- LÓGICA DEL LOADER ---
        window.addEventListener('load', () => {
            const name = "Paola Herrera Sol";
            const nameEl = document.getElementById('loaderName');
            
            // Animación de letras
            nameEl.innerHTML = name.split('').map((char, i) =>
                char === ' ' ? '&nbsp;' : `<span style="animation-delay: ${i * 0.05}s">${char}</span>`
            ).join('');

            // Ocultar loader y mostrar página
            setTimeout(() => {
                document.getElementById('loaderScreen').classList.add('hidden');
                document.getElementById('mainPage').classList.add('loaded');
            }, 1300);
        });

        // --- CAMBIO DE TEMA (DARK/LIGHT) ---
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeBtn.textContent = document.body.classList.contains('dark-mode') ? '☀' : '☾';
        });

        // --- SISTEMA DE IDIOMAS ---
        const langPicker = document.getElementById('langPicker');
        const langTrigger = document.getElementById('langTrigger');
        const langCurrent = document.getElementById('langCurrent');
        const langOpts = document.querySelectorAll('.lang-opt');

        // Abrir/Cerrar menú
        langTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            langPicker.classList.toggle('open');
            const isExpanded = langTrigger.getAttribute('aria-expanded') === 'true';
            langTrigger.setAttribute('aria-expanded', !isExpanded);
        });

        // Cerrar al hacer clic fuera
        document.addEventListener('click', (e) => {
            if (!langPicker.contains(e.target)) {
                langPicker.classList.remove('open');
                langTrigger.setAttribute('aria-expanded', 'false');
            }
        });

        let currentLang = 'es';
        let wordIndex = 0;

        // Aplicar idioma
        langOpts.forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentLang = e.target.getAttribute('data-lang');
                const t = translations[currentLang];
                
                langCurrent.textContent = t.current;

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if(t[key]) {
                        if(el.tagName === 'A') {
                             el.innerHTML = `<span aria-hidden="true">&gt;</span> ${t[key].replace('> ', '')}`;
                        } else {
                            el.textContent = t[key];
                        }
                    }
                });

                langOpts.forEach(opt => opt.classList.remove('active'));
                btn.classList.add('active');
                langPicker.classList.remove('open');
                langTrigger.setAttribute('aria-expanded', 'false');
                
                // Reiniciar texto rotativo
                wordIndex = 0; 
                updateRotatingText();
            });
        });

        // --- TEXTO ROTATIVO ---
        const rotatingTextEl = document.getElementById('rotatingText');
        function updateRotatingText() {
            const words = translations[currentLang].words;
            rotatingTextEl.textContent = words[wordIndex];
            wordIndex = (wordIndex + 1) % words.length;
        }
        setInterval(updateRotatingText, 2500);
        updateRotatingText(); // Init inicial

        // --- CURSOR PERSONALIZADO ---
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Efecto hover en enlaces y botones
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('grow'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
        });

        // --- CANVAS DE PARTÍCULAS (FONDO) ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = (Math.random() * 0.5) - 0.25;
                this.speedY = (Math.random() * 0.5) - 0.25;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Rebote en bordes
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                // Color dependiendo del modo oscuro o claro
                ctx.fillStyle = document.body.classList.contains('dark-mode') 
                    ? 'rgba(255, 217, 61, 0.4)' 
                    : 'rgba(30, 30, 30, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) {
            particles.push(new Particle());
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

    </script>
</body>
</html>
