<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paola Herrera | Diseño Gráfico</title>

<!-- Favicon completo -->
<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#FFD93D;
    --text:#1E1E1E;
    --accent:#1E1E1E;
    --card:rgba(255,255,255,.12);
}

body.dark-mode{
    --bg:#000000;
    --text:#FFD93D;
    --accent:#FFD93D;
    --card:rgba(255,215,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', Arial, Helvetica, sans-serif;
    transition:.3s ease;
}

/* ========== PANTALLA DE CARGA ========== */
.loader-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 2rem;
    transition: opacity 0.6s ease, visibility 0.6s ease;
}

.loader-screen.hidden {
    opacity: 0;
    visibility: hidden;
}

/* Spinner de carga */
.spinner {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(0,0,0,0.1);
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loader-text {
    font-size: 1.2rem;
    font-weight: 500;
    letter-spacing: 2px;
    animation: pulse 1.5s ease infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

/* ========== CONTENIDO PRINCIPAL CON FADE-IN ========== */
.page {
    height: 100vh;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
}

.page.loaded {
    opacity: 1;
    transform: translateY(0);
}

/* Animaciones escalonadas para elementos hijos */
.fade-item {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s ease;
}

.page.loaded .fade-item {
    opacity: 1;
    transform: translateY(0);
}

/* Retrasos escalonados para cada elemento */
.page.loaded .logo { transition-delay: 0.1s; }
.page.loaded .theme-toggle { transition-delay: 0.15s; }
.page.loaded .michito { transition-delay: 0.2s; }
.page.loaded .hero-title { transition-delay: 0.35s; }
.page.loaded .hero-subtitle { transition-delay: 0.5s; }
.page.loaded .nav-btn:nth-child(1) { transition-delay: 0.65s; }
.page.loaded .nav-btn:nth-child(2) { transition-delay: 0.8s; }
.page.loaded .nav-btn:nth-child(3) { transition-delay: 0.95s; }
.page.loaded .social a:nth-child(1) { transition-delay: 1.1s; }
.page.loaded .social a:nth-child(2) { transition-delay: 1.2s; }
.page.loaded .social a:nth-child(3) { transition-delay: 1.3s; }
.page.loaded .social a:nth-child(4) { transition-delay: 1.4s; }
.page.loaded .social a:nth-child(5) { transition-delay: 1.5s; }
.page.loaded .copy { transition-delay: 1.6s; }

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:2rem 3rem;
}

.logo img{
    height:75px;
}

.theme-toggle{
    background:none;
    border:none;
    color:var(--accent);
    font-size:2rem;
    cursor:pointer;
}

/* MAIN */
main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:2rem;
}

.michito{
    width:min(420px,70vw);
    max-height:45vh;
    object-fit:contain;
    margin-bottom:2rem;
}

.hero-title{
    font-size:clamp(1.8rem,4vw,3rem);
    font-weight:700;
    margin-bottom:.5rem;
}

.hero-subtitle{
    font-size:clamp(1rem,2vw,1.3rem);
    opacity:.85;
    margin-bottom:3rem;
}

/* NAV */
.main-nav{
    display:flex;
    gap:2rem;
    flex-wrap:wrap;
    justify-content:center;
}

.nav-btn{
    display:flex;
    align-items:center;
    gap:.8rem;
    text-decoration:none;
    color:var(--accent);
    font-size:1.6rem;
    font-weight:600;
    padding:1rem 1.8rem;
    border:3px solid var(--accent);
    border-radius:999px;
    transition:.25s;
}

.nav-btn:hover{
    background:var(--accent);
    color:var(--bg);
    transform:translateY(-4px);
}

/* FOOTER */
footer{
    padding:1.5rem;
    text-align:center;
}

.social{
    display:flex;
    justify-content:center;
    gap:1.5rem;
    margin-bottom:.8rem;
}

.social a{
    color:var(--accent);
    font-size:1.5rem;
    transition:.2s;
}

.social a:hover{
    transform:translateY(-3px);
}

.copy{
    font-size:.9rem;
    opacity:.7;
}

/* MOBILE */
@media(max-width:768px){
    header{
        padding:1rem 1.5rem;
    }
    .logo img{
        height:55px;
    }
    .michito{
        width:min(300px,80vw);
    }
    .main-nav{
        flex-direction:column;
        width:100%;
        max-width:320px;
    }
    .nav-btn{
        justify-content:center;
        width:100%;
    }
}

</style>
</head>

<body>

<!-- PANTALLA DE CARGA -->
<div class="loader-screen" id="loaderScreen">
    <div class="spinner"></div>
    <div class="loader-text">Cargando...</div>
</div>

<div class="page" id="mainPage">

<header>

    <div class="logo fade-item">
        <img src="assets/about/MICHITO_MEMBRETADA-04.webp" alt="Michito Diseñador">
    </div>

    <button class="theme-toggle fade-item" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

</header>

<main>

    <img
        class="michito fade-item"
        src="assets/michito-home.webp"
        alt="Michito Diseñador">

    <h1 class="hero-title fade-item">
        Paola Herrera Sol
    </h1>

    <p class="hero-subtitle fade-item">
        Diseñadora gráfica e ilustradora
    </p>

    <nav class="main-nav">

        <a href="about.html" class="nav-btn fade-item">
            <i class="fas fa-circle-chevron-right"></i>
            Sobre mí
        </a>

        <a href="portfolio.html" class="nav-btn fade-item">
            <i class="fas fa-circle-chevron-right"></i>
            Portafolio
        </a>

        <a href="contact.html" class="nav-btn fade-item">
            <i class="fas fa-circle-chevron-right"></i>
            Contacto
        </a>

    </nav>

</main>

<footer>

    <div class="social">

        <a href="https://github.com/MichitoDisenador" target="_blank" class="fade-item">
            <i class="fab fa-github"></i>
        </a>

        <a href="https://dribbble.com/michitodisenador" target="_blank" class="fade-item">
            <i class="fab fa-dribbble"></i>
        </a>

        <a href="https://www.linkedin.com/in/michito-disenador/" target="_blank" class="fade-item">
            <i class="fab fa-linkedin"></i>
        </a>

        <a href="https://www.facebook.com/michitodisenador" target="_blank" class="fade-item">
            <i class="fab fa-facebook-f"></i>
        </a>

        <a href="mailto:sapichaan@gmail.com" class="fade-item">
            <i class="fas fa-envelope"></i>
        </a>

    </div>

    <div class="copy fade-item">
        © 2026 | Diseñado con ❤️ por Paola Herrera Sol
    </div>

</footer>

</div>

<script>

// ========== PANTALLA DE CARGA ==========
window.addEventListener('load', function() {
    // Ocultar loader después de que todo esté cargado
    const loader = document.getElementById('loaderScreen');
    const mainPage = document.getElementById('mainPage');
    
    // Pequeño retraso para que se vea la animación (opcional)
    setTimeout(function() {
        loader.classList.add('hidden');
        mainPage.classList.add('loaded');
    }, 800); // 0.8 segundos de pantalla de carga
});

// ========== TEMA OSCURO/CLARO ==========
const body = document.body;
const btn = document.getElementById("themeToggle");
const icon = btn.querySelector("i");

const savedTheme = localStorage.getItem("theme");

if(savedTheme === "dark"){
    body.classList.add("dark-mode");
    icon.classList.replace("fa-moon","fa-sun");
}

btn.addEventListener("click",()=>{
    body.classList.toggle("dark-mode");

    if(body.classList.contains("dark-mode")){
        localStorage.setItem("theme","dark");
        icon.classList.replace("fa-moon","fa-sun");
    }else{
        localStorage.setItem("theme","light");
        icon.classList.replace("fa-sun","fa-moon");
    }
});

// ========== PRE-CARGA DE IMÁGENES (opcional, para mejor experiencia) ==========
function preloadImages() {
    const images = document.querySelectorAll('img');
    let loadedImages = 0;
    const totalImages = images.length;
    
    if(totalImages === 0) return;
    
    images.forEach(img => {
        if(img.complete) {
            loadedImages++;
        } else {
            img.addEventListener('load', () => {
                loadedImages++;
                if(loadedImages === totalImages) {
                    // Todas las imágenes están cargadas
                    console.log('Todas las imágenes cargadas');
                }
            });
            img.addEventListener('error', () => {
                loadedImages++;
            });
        }
    });
}

preloadImages();

</script>

</body>
</html>
