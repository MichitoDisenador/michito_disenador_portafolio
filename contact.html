<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contacto | Paola Herrera Sol</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #faf8f5;
            --bg-soft: #f5f0e8;
            --bg-glow: #f0e8d8;
            --text: #1e1e1e;
            --gold: #b8943c;
            --gold-light: #d4b87a;
            --gold-soft: #c9a85e;
            --muted: #a08050;
            --accent: #b8943c;
            --line: rgba(184, 148, 60, 0.25);
            --shadow: rgba(184, 148, 60, 0.15);
            --cursor: #b8943c;
            --header-bg: rgba(250, 248, 245, 0.65);
            --header-border: rgba(184, 148, 60, 0.15);
            --surface: rgba(255, 252, 245, 0.7);
            --glow-shadow: 0 0 12px rgba(184, 148, 60, 0.3), 0 0 20px rgba(184, 148, 60, 0.1);
        }

        body.dark-mode {
            --bg: #0b0b0b;
            --bg-soft: #161616;
            --bg-glow: #1a1a1a;
            --text: #ffffff;
            --gold: #ffd93d;
            --gold-light: #ffe875;
            --gold-soft: #ffd93d;
            --muted: #c9bb68;
            --accent: #ffd93d;
            --line: rgba(255, 217, 61, 0.28);
            --shadow: rgba(255, 217, 61, 0.12);
            --cursor: #ffd93d;
            --header-bg: rgba(11, 11, 11, 0.75);
            --header-border: rgba(255, 217, 61, 0.15);
            --surface: rgba(20, 20, 20, 0.7);
            --glow-shadow: 0 0 12px rgba(255, 217, 61, 0.3), 0 0 20px rgba(255, 217, 61, 0.1);
        }

        html { scroll-behavior: smooth; }

        body {
            background: 
                radial-gradient(ellipse at 30% 20%, var(--bg-glow), transparent 45rem),
                radial-gradient(ellipse at 70% 80%, var(--bg-soft), transparent 40rem),
                linear-gradient(145deg, var(--bg), var(--bg-soft));
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            transition: background .45s ease, color .35s;
            overflow-x: hidden;
            min-height: 100vh;
            cursor: none;
        }

        button, a { cursor: none; }

        @media (max-width: 720px) {
            body { cursor: auto; }
            button, a { cursor: pointer; }
        }

        /* ===== CURSOR ===== */
        #cursor {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 999;
            width: 12px;
            height: 12px;
            border-radius: 999px;
            background: var(--cursor);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: transform .12s ease, opacity .2s, background .2s;
            mix-blend-mode: multiply;
        }
        body.dark-mode #cursor { mix-blend-mode: normal; }
        #cursor.grow { opacity: .35; transform: translate(-50%, -50%) scale(4); }
        @media (max-width:720px) { #cursor, body #cursor { display: none !important; } }

        /* ===== PARTICLES ===== */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            opacity: .30;
            pointer-events: none;
        }
        body.dark-mode #particleCanvas { opacity: .50; }

        /* ===== PAGE - ESTRUCTURA IGUAL A ABOUT ===== */
        .page {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            opacity: 0;
            transition: opacity .45s ease;
        }
        .page.loaded { opacity: 1; }

        /* ===== HEADER - COPIADO EXACTAMENTE DE ABOUT ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(0.8rem, 2vw, 1.2rem) clamp(1rem, 5vw, 3.5rem);
            gap: 1rem;
            background: var(--header-bg);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border-bottom: 1px solid var(--header-border);
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            box-shadow: 0 2px 30px rgba(0,0,0,0.04);
        }
        body.dark-mode header {
            box-shadow: 0 2px 30px rgba(0,0,0,0.3);
        }
        header.scrolled {
            background: var(--header-bg);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border-bottom: 1px solid var(--header-border);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: .75rem;
            color: var(--text);
            text-decoration: none;
            flex-shrink: 0;
        }
        .logo img {
            height: 55px;
            width: auto;
            display: block;
            transition: transform .2s, opacity .2s;
        }
        .logo img:hover { transform: scale(0.97); opacity: 0.9; }

        .header-right {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-shrink: 0;
        }

        .pill-button, .theme-toggle {
            min-height: 38px;
            border: 1.5px solid var(--accent);
            background: rgba(255,255,255,0.08);
            color: var(--accent);
            font: 800 .78rem/1 'Inter', system-ui, sans-serif;
            transition: transform .2s, background .2s, color .2s, border-color .2s;
        }
        .pill-button {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            padding: .55rem .85rem;
            border-radius: 999px;
            letter-spacing: .08em;
        }
        .theme-toggle {
            width: 38px;
            border-radius: 50%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pill-button:hover, .theme-toggle:hover {
            background: var(--accent);
            color: var(--bg);
            transform: translateY(-2px);
        }

        .lang-picker { position: relative; }
        .lang-dropdown {
            position: absolute;
            top: calc(100% + .65rem);
            right: 0;
            z-index: 10;
            display: grid;
            width: 170px;
            padding: .45rem;
            border: 1.5px solid var(--accent);
            border-radius: 8px;
            background: var(--bg);
            box-shadow: 0 16px 34px var(--shadow);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
            transition: opacity .18s, transform .18s;
        }
        .lang-picker.open .lang-dropdown {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .lang-opt {
            border: 0;
            border-radius: 6px;
            padding: .6rem .7rem;
            background: transparent;
            color: var(--text);
            font: 700 .86rem/1.1 'Inter', system-ui, sans-serif;
            text-align: left;
        }
        .lang-opt:hover, .lang-opt.active {
            background: var(--accent);
            color: var(--bg);
        }

        @media (max-width: 720px) {
            .logo img { height: 40px; }
            .pill-button { padding-inline: .6rem; font-size: 0.7rem; min-height: 34px; }
            .theme-toggle { width: 34px; min-height: 34px; font-size: 0.85rem; }
            header { padding: 0.6rem 1rem; }
        }

        /* ===== MAIN ===== */
        main {
            padding-top: 80px;
            max-width: 880px;
            margin: 0 auto;
            padding-left: clamp(1.2rem, 5vw, 2rem);
            padding-right: clamp(1.2rem, 5vw, 2rem);
            padding-bottom: 2rem;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        @media (min-width: 768px) {
            main { padding-top: 96px; }
        }

        /* ===== SCROLL REVEAL ===== */
        .scroll-reveal {
            transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
            transform: translateY(30px);
        }
        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== HERO ===== */
        .contact-hero {
            text-align: center;
            margin: 1.5rem 0 2rem;
        }
        @media (min-width: 768px) {
            .contact-hero { margin: 2rem 0 2.5rem; }
        }
        .contact-hero h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.6rem;
            color: var(--gold);
        }
        .contact-hero p {
            max-width: 600px;
            margin: 0 auto;
            font-size: clamp(0.95rem, 1.2vw, 1.1rem);
            color: var(--text);
            opacity: 0.8;
            line-height: 1.6;
        }

        /* ===== FORMULARIO ===== */
        .contact-form {
            background: var(--surface);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 32px;
            padding: clamp(1.5rem, 3vw, 2.5rem);
            margin: 1.5rem auto;
            max-width: 700px;
            box-shadow: var(--glow-shadow);
            border: 1px solid var(--line);
            transition: box-shadow 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
        }
        .contact-form:hover {
            box-shadow: 0 0 18px rgba(184, 148, 60, 0.2), 0 0 28px rgba(184, 148, 60, 0.08);
            border-color: var(--gold);
            transform: translateY(-2px);
        }
        body.dark-mode .contact-form:hover {
            box-shadow: 0 0 18px rgba(255, 217, 61, 0.2), 0 0 28px rgba(255, 217, 61, 0.08);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }
        @media (min-width: 768px) {
            .form-group { margin-bottom: 1.5rem; }
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 0.02em;
        }
        @media (min-width: 768px) {
            .form-group label { font-size: 0.95rem; margin-bottom: 0.5rem; }
        }

        .form-control {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 2px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'Inter', system-ui, sans-serif;
            transition: all 0.3s;
        }
        @media (min-width: 768px) {
            .form-control { padding: 0.85rem 1.1rem; font-size: 1rem; }
        }
        body.dark-mode .form-control {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 217, 61, 0.2);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(184, 148, 60, 0.15);
        }
        body.dark-mode .form-control:focus {
            box-shadow: 0 0 0 3px rgba(255, 217, 61, 0.15);
        }

        textarea.form-control {
            min-height: 110px;
            resize: vertical;
        }
        @media (min-width: 768px) {
            textarea.form-control { min-height: 130px; }
        }

        .phone-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .phone-group select {
            width: auto;
            min-width: 110px;
            flex-shrink: 0;
        }
        .phone-group input {
            flex: 1;
        }
        .form-hint {
            display: block;
            margin-top: 0.3rem;
            font-size: 0.7rem;
            color: var(--muted);
        }

        .submit-btn {
            background: var(--gold);
            color: var(--bg);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: none;
            transition: all 0.3s;
            width: 100%;
        }
        @media (min-width: 768px) {
            .submit-btn { padding: 0.9rem 2rem; font-size: 1rem; }
        }
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(184, 148, 60, 0.3);
            background: var(--gold-light);
        }
        body.dark-mode .submit-btn:hover {
            box-shadow: 0 10px 25px rgba(255, 217, 61, 0.3);
            background: #ffe44d;
        }
        @media (max-width: 720px) {
            .submit-btn { cursor: pointer; }
        }

        /* ===== FOOTER - COPIADO EXACTAMENTE DE ABOUT ===== */
        footer {
            display: grid;
            gap: .6rem;
            justify-items: center;
            padding: 0.8rem clamp(1rem, 4vw, 2rem) 1.2rem;
            margin-top: 1rem;
        }
        .social {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            opacity: 0;
        }
        .page.loaded .social { animation: fadeUp .5s .88s ease forwards; }
        .social a {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            border: 1.5px solid var(--line);
            border-radius: 50%;
            color: var(--gold);
            font-size: 1.2rem;
            text-decoration: none;
            transition: transform .18s, border-color .18s, background .18s, color .18s;
            opacity: 0.7;
        }
        .social a:hover {
            border-color: var(--gold);
            background: var(--gold);
            color: var(--bg);
            transform: translateY(-4px);
            opacity: 1;
        }
        .copy {
            color: var(--muted);
            font-size: .72rem;
            opacity: 0;
            text-decoration: none;
        }
        .page.loaded .copy { animation: fadeUp .5s 1s ease forwards; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== POPUP ===== */
        #successPopup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .popup-content {
            background: var(--surface);
            border-radius: 32px;
            padding: 2rem;
            max-width: 380px;
            width: 90%;
            text-align: center;
            border: 2px solid var(--gold);
            box-shadow: 0 0 40px rgba(184, 148, 60, 0.2);
        }
        body.dark-mode .popup-content {
            box-shadow: 0 0 40px rgba(255, 217, 61, 0.15);
        }
        .popup-content .check {
            font-size: 3.5rem;
            color: #4CAF50;
            margin-bottom: 0.8rem;
        }
        .popup-content h3 {
            color: var(--gold);
            margin-bottom: 0.6rem;
            font-size: 1.3rem;
        }
        .popup-content p {
            color: var(--muted);
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }
        .popup-content .close-btn {
            background: var(--gold);
            color: var(--bg);
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .popup-content .close-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(184, 148, 60, 0.3);
        }
        body.dark-mode .popup-content .close-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 217, 61, 0.3);
        }
        @media (max-width: 720px) {
            .popup-content .close-btn { cursor: pointer; }
        }

        @media (max-width: 720px) {
            #cursor { display: none !important; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div id="cursor" aria-hidden="true"></div>
    <canvas id="particleCanvas" aria-hidden="true"></canvas>

    <div class="page" id="mainPage">
        <!-- HEADER COPIADO EXACTAMENTE DE ABOUT -->
        <header id="mainHeader">
            <a class="logo" href="./index.html" aria-label="Inicio">
                <img src="assets/about/MICHITO_MEMBRETADA-04.webp" alt="Logo Michito Diseñador">
            </a>

            <div class="header-right">
                <div class="lang-picker" id="langPicker">
                    <button class="pill-button" id="langTrigger" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Cambiar idioma">
                        <span id="langCurrent">ES</span>
                        <span aria-hidden="true">▼</span>
                    </button>
                    <div class="lang-dropdown" id="langDropdown" role="menu">
                        <button class="lang-opt active" type="button" data-lang="es">Español</button>
                        <button class="lang-opt" type="button" data-lang="en">English</button>
                        <button class="lang-opt" type="button" data-lang="fr">Français</button>
                        <button class="lang-opt" type="button" data-lang="pt">Português</button>
                    </div>
                </div>

                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar tema">☾</button>
            </div>
        </header>

        <main>
            <!-- HERO -->
            <div class="scroll-reveal">
                <div class="contact-hero">
                    <h1>Hablemos de tu proyecto</h1>
                    <p>¿Tienes una idea creativa? Completa el formulario y me pondré en contacto contigo en menos de 24 horas.</p>
                </div>
            </div>

            <!-- FORMULARIO -->
            <div class="scroll-reveal">
                <div class="contact-form">
                    <form id="contactForm" action="https://formspree.io/f/mnnvldov" method="POST">
                        <div class="form-group">
                            <label for="name">Nombre completo</label>
                            <input type="text" id="name" name="name" class="form-control" required placeholder="Tu nombre">
                        </div>

                        <div class="form-group">
                            <label for="email">Correo electrónico</label>
                            <input type="email" id="email" name="email" class="form-control" required placeholder="tucorreo@ejemplo.com">
                        </div>

                        <div class="form-group">
                            <label for="phone">Teléfono</label>
                            <div class="phone-group">
                                <select id="countryCode" name="countryCode" class="form-control">
                                    <option value="+52">🇲🇽 +52</option>
                                    <option value="+1">🇺🇸 +1</option>
                                    <option value="+34">🇪🇸 +34</option>
                                    <option value="+54">🇦🇷 +54</option>
                                    <option value="+57">🇨🇴 +57</option>
                                    <option value="+56">🇨🇱 +56</option>
                                    <option value="+51">🇵🇪 +51</option>
                                    <option value="+33">🇫🇷 +33</option>
                                    <option value="+49">🇩🇪 +49</option>
                                    <option value="+44">🇬🇧 +44</option>
                                    <option value="+55">🇧🇷 +55</option>
                                </select>
                                <input type="tel" id="phone" name="phone" class="form-control" placeholder="Número de teléfono">
                            </div>
                            <span class="form-hint">Ej: 55 1234 5678</span>
                        </div>

                        <div class="form-group">
                            <label for="message">Mensaje</label>
                            <textarea id="message" name="message" class="form-control" required placeholder="Cuéntame sobre tu proyecto..."></textarea>
                        </div>

                        <button type="submit" class="submit-btn">Enviar mensaje</button>
                    </form>
                </div>
            </div>
            <!-- ELIMINADO: .contact-social -->
        </main>

        <!-- FOOTER COPIADO EXACTAMENTE DE ABOUT -->
        <footer>
            <div class="social" aria-label="Redes sociales">
                <a href="https://github.com/MichitoDisenador" target="_blank" rel="noreferrer" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://dribbble.com/michitodisenador" target="_blank" rel="noreferrer" aria-label="Dribbble"><i class="fab fa-dribbble"></i></a>
                <a href="https://www.linkedin.com/in/michito-disenador/" target="_blank" rel="noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="https://www.facebook.com/michitodisenador" target="_blank" rel="noreferrer" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="mailto:sapichaan@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
            </div>
            <div class="copy">© 2026 | Diseñado por Paola Herrera Sol</div>
        </footer>
    </div>

    <!-- POPUP DE ÉXITO -->
    <div id="successPopup">
        <div class="popup-content">
            <div class="check">✓</div>
            <h3>¡Mensaje enviado!</h3>
            <p>Gracias por contactarme. Te responderé en menos de 24 horas.</p>
            <button class="close-btn" id="closePopupBtn">Cerrar</button>
        </div>
    </div>

    <script>
        // ===== CURSOR =====
        const cursor = document.getElementById('cursor');
        if (window.innerWidth > 720) {
            document.addEventListener('mousemove', (e) => {
                if (cursor) { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; }
            });
            document.addEventListener('mousedown', () => { if (cursor) cursor.classList.add('grow'); });
            document.addEventListener('mouseup', () => { if (cursor) cursor.classList.remove('grow'); });
        }

        // ===== PARTICLES =====
        const canvas = document.getElementById('particleCanvas');
        let ctx = null, particles = [], mouseX = null, mouseY = null, animId = null;
        if (canvas) {
            ctx = canvas.getContext('2d');
            const resizeCanvas = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.5;
                    this.speedY = (Math.random() - 0.5) * 0.5;
                    this.opacity = Math.random() * 0.4 + 0.1;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                    if (mouseX !== null && mouseY !== null) {
                        const dx = mouseX - this.x, dy = mouseY - this.y, dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 120) { const force = (120 - dist) / 120 * 0.3; this.x -= dx * force; this.y -= dy * force; }
                    }
                }
                draw() {
                    if (!ctx) return;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    const isDark = document.body.classList.contains('dark-mode');
                    ctx.fillStyle = isDark ? `rgba(255,217,61,${this.opacity * 0.7})` : `rgba(184, 148, 60, ${this.opacity * 0.4})`;
                    ctx.fill();
                }
            }

            const pCount = Math.min(80, Math.floor(window.innerWidth * 0.08));
            for (let i = 0; i < pCount; i++) particles.push(new Particle());

            function animate() {
                if (!ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                animId = requestAnimationFrame(animate);
            }
            animate();

            document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
            document.addEventListener('mouseleave', () => { mouseX = null; mouseY = null; });
        }

        // ===== PAGE LOADED =====
        const mainPage = document.getElementById('mainPage');
        if (mainPage) setTimeout(() => mainPage.classList.add('loaded'), 200);

        // ===== DARK MODE =====
        const themeToggle = document.getElementById('themeToggle');
        let darkMode = false;
        try { darkMode = localStorage.getItem('theme') === 'dark'; } catch(e) {}

        function applyTheme() {
            if (darkMode) {
                document.body.classList.add('dark-mode');
                if (themeToggle) themeToggle.textContent = '☀';
            } else {
                document.body.classList.remove('dark-mode');
                if (themeToggle) themeToggle.textContent = '☾';
            }
            try { localStorage.setItem('theme', darkMode ? 'dark' : 'light'); } catch(e) {}
            particles.forEach(p => { p.opacity = Math.random() * 0.4 + 0.1; });
        }
        applyTheme();

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                darkMode = !darkMode;
                applyTheme();
            });
        }

        // ===== HEADER SCROLL EFFECT =====
        const header = document.getElementById('mainHeader');
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset || document.documentElement.scrollTop;
            if (currentScroll > 30) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // ===== SCROLL REVEAL =====
        const revealItems = document.querySelectorAll('.scroll-reveal');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('revealed');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -20px 0px' });

        revealItems.forEach(el => observer.observe(el));

        window.addEventListener('load', () => {
            revealItems.forEach(el => {
                const rect = el.getBoundingClientRect();
                if (rect.top < window.innerHeight - 80) {
                    el.classList.add('revealed');
                    observer.unobserve(el);
                }
            });
        });

        // ===== FORMULARIO CON POPUP =====
        const popup = document.getElementById('successPopup');
        const formContacto = document.getElementById('contactForm');

        if (formContacto) {
            formContacto.addEventListener('submit', async function(e) {
                e.preventDefault();

                const datos = new FormData(formContacto);

                try {
                    const respuesta = await fetch(formContacto.action, {
                        method: 'POST',
                        body: datos,
                        headers: { 'Accept': 'application/json' }
                    });

                    if (respuesta.ok) {
                        popup.style.display = 'flex';
                        formContacto.reset();

                        setTimeout(() => {
                            popup.style.display = 'none';
                        }, 4000);
                    } else {
                        alert('Error al enviar. Por favor, intenta de nuevo.');
                    }
                } catch (error) {
                    alert('Error de conexión. Verifica tu internet.');
                }
            });
        }

        document.getElementById('closePopupBtn')?.addEventListener('click', () => {
            popup.style.display = 'none';
        });

        popup?.addEventListener('click', (e) => {
            if (e.target === popup) {
                popup.style.display = 'none';
            }
        });

        // ===== IMAGE ERROR FALLBACK =====
        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('error', function() {
                console.warn('Imagen no encontrada:', this.src);
                this.style.display = 'none';
            });
        });
    </script>
</body>
</html>
