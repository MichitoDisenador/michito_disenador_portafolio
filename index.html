<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paola Herrera | Diseño Gráfico</title>

<!-- Favicon completo -->
<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#FFD93D;
    --text:#1E1E1E;
    --accent:#1E1E1E;
    --card:rgba(255,255,255,.12);
}

body.dark-mode{
    --bg:#000000;
    --text:#FFD93D;
    --accent:#FFD93D;
    --card:rgba(255,215,0,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', Arial, Helvetica, sans-serif;
    transition:.3s ease;
}

.page{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:2rem 3rem;
}

.logo img{
    height:75px;
}

.theme-toggle{
    background:none;
    border:none;
    color:var(--accent);
    font-size:2rem;
    cursor:pointer;
}

/* MAIN */

main{
    flex:1;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:2rem;
}

.michito{
    width:min(420px,70vw);
    max-height:45vh;
    object-fit:contain;

    margin-bottom:2rem;
}

.hero-title{
    font-size:clamp(1.8rem,4vw,3rem);
    font-weight:700;

    margin-bottom:.5rem;
}

.hero-subtitle{
    font-size:clamp(1rem,2vw,1.3rem);

    opacity:.85;

    margin-bottom:3rem;
}

/* NAV */

.main-nav{
    display:flex;
    gap:2rem;
    flex-wrap:wrap;
    justify-content:center;
}

.nav-btn{
    display:flex;
    align-items:center;
    gap:.8rem;

    text-decoration:none;

    color:var(--accent);

    font-size:1.6rem;
    font-weight:600;

    padding:1rem 1.8rem;

    border:3px solid var(--accent);

    border-radius:999px;

    transition:.25s;
}

.nav-btn:hover{
    background:var(--accent);
    color:var(--bg);

    transform:translateY(-4px);
}

/* FOOTER */

footer{
    padding:1.5rem;

    text-align:center;
}

.social{
    display:flex;
    justify-content:center;
    gap:1.5rem;

    margin-bottom:.8rem;
}

.social a{
    color:var(--accent);
    font-size:1.5rem;
    transition:.2s;
}

.social a:hover{
    transform:translateY(-3px);
}

.copy{
    font-size:.9rem;
    opacity:.7;
}

/* MOBILE */

@media(max-width:768px){

    header{
        padding:1rem 1.5rem;
    }

    .logo img{
        height:55px;
    }

    .michito{
        width:min(300px,80vw);
    }

    .main-nav{
        flex-direction:column;
        width:100%;
        max-width:320px;
    }

    .nav-btn{
        justify-content:center;
        width:100%;
    }

}

</style>
</head>

<body>

<div class="page">

<header>

    <div class="logo">
        <img src="assets/about/MICHITO_MEMBRETADA-04.webp" alt="Michito Diseñador">
    </div>

    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

</header>

<main>

    <img
        class="michito"
        src="assets/michito-home.webp"
        alt="Michito Diseñador">

    <h1 class="hero-title">
        Paola Herrera Sol
    </h1>

    <p class="hero-subtitle">
        Diseñadora gráfica e ilustradora
    </p>

    <nav class="main-nav">

        <a href="about.html" class="nav-btn">
            <i class="fas fa-circle-chevron-right"></i>
            Sobre mí
        </a>

        <a href="portfolio.html" class="nav-btn">
            <i class="fas fa-circle-chevron-right"></i>
            Portafolio
        </a>

        <a href="contact.html" class="nav-btn">
            <i class="fas fa-circle-chevron-right"></i>
            Contacto
        </a>

    </nav>

</main>

<footer>

    <div class="social">

        <a href="https://github.com/MichitoDisenador" target="_blank">
            <i class="fab fa-github"></i>
        </a>

        <a href="https://dribbble.com/michitodisenador" target="_blank">
            <i class="fab fa-dribbble"></i>
        </a>

        <a href="https://www.linkedin.com/in/michito-disenador/" target="_blank">
            <i class="fab fa-linkedin"></i>
        </a>

        <a href="https://www.facebook.com/michitodisenador" target="_blank">
            <i class="fab fa-facebook-f"></i>
        </a>

        <a href="mailto:sapichaan@gmail.com">
            <i class="fas fa-envelope"></i>
        </a>

    </div>

    <div class="copy">
        © 2026 | Diseñado con ❤️ por Paola Herrera Sol
    </div>

</footer>

</div>

<script>

const body = document.body;
const btn = document.getElementById("themeToggle");
const icon = btn.querySelector("i");

const savedTheme = localStorage.getItem("theme");

if(savedTheme === "dark"){
    body.classList.add("dark-mode");
    icon.classList.replace("fa-moon","fa-sun");
}

btn.addEventListener("click",()=>{

    body.classList.toggle("dark-mode");

    if(body.classList.contains("dark-mode")){
        localStorage.setItem("theme","dark");
        icon.classList.replace("fa-moon","fa-sun");
    }else{
        localStorage.setItem("theme","light");
        icon.classList.replace("fa-sun","fa-moon");
    }

});

</script>

</body>
</html>
